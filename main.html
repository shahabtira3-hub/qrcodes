<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر النخبة</title>
  <meta name="description" content="أفضل المنتجات بأعلى جودة - توصيل لجميع المحافظات" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 18px 32px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar-wrap {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      width: 100%;
      height: 100%;
      background: #2563eb;
      color: #ffffff;
      font-size: 40px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .bio {
      font-size: 14px;
      line-height: 1.7;
      color: #475569;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 0;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 13px 16px;
      border-radius: 16px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .link-btn:hover, .link-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.14);
    }
    .link-right {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .link-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .link-label {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .arrow {
      width: 18px;
      height: 18px;
      opacity: 0.5;
      flex-shrink: 0;
    }
    footer {
      margin-top: 34px;
      font-size: 12px;
      opacity: 0.55;
    }
  </style>
</head>
